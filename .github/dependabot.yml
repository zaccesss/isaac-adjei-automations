# updates for the GitHub Actions the workflows use and the scraper's Python dependencies,
# checked at 18:00 UK on the 1st and 15th of each month. Major bumps are left for manual review.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 5
    # every github/codeql-action step moves in one PR: the action refuses to run when init and
    # analyze are on different versions, which a one-step bump on 26 October 2026 showed
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 5
    # every Python dependency moves in one PR, so a run opens one pull request for pip at most
    groups:
      python:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
