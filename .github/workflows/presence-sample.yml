# records Discord presence from Lanyard into presence_samples and presence_sessions for the
# dashboard's Presence page. cron-ops dispatches it every 15 minutes; the schedule below is the
# hourly backup. Skips cleanly until DISCORD_USER_ID is set.

name: Presence sample

on:
  schedule:
    - cron: "41 * * * *" # hourly backup; the primary cadence is cron-ops every 15 min
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - run: node scripts/presence-sample.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_ERRORS: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
