name: Vitafolio Jobs

# sends the fresh employer-direct student roles to Vitafolio's Jobs page after each scrape. A
# separate workflow so it can be run on its own and never affects the scraper's own result
on:
  workflow_run:
    workflows: ["Job Scraper"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be sent and send nothing"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    # runs after any finished scrape: a run cut off at its time limit still saved what it found, and
    # the push only sends roles stamped in the last two days, so nothing half-finished goes out
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r scripts/requirements.txt

      - name: Push employer roles to Vitafolio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITAFOLIO_JOBS_URL: ${{ vars.VITAFOLIO_JOBS_URL }}
          VITAFOLIO_JOBS_TOKEN: ${{ secrets.VITAFOLIO_JOBS_TOKEN }}
          VITAFOLIO_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        run: python scripts/push-vitafolio-jobs.py
