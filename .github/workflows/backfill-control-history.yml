# One-time (or re-runnable) deep backfill for the portfolio Ops page's history tables, going
# further back than the regular control-status-sync ever sees on its own. Manual only - there is no
# schedule here, this is not meant to run automatically.

name: Backfill control history

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - run: node scripts/backfill-control-history.mjs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DISCORD_WEBHOOK_ERRORS: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
          HEALTHCHECKS_FLEET_API_KEY: ${{ secrets.HEALTHCHECKS_FLEET_API_KEY }}
          HEALTHCHECKS_PORTFOLIO_API_KEY: ${{ secrets.HEALTHCHECKS_PORTFOLIO_API_KEY }}
